{% extends "base.html" %}{% block title %}Send a video{% endblock %}{% block content %}<section class="hero"><small>MEMBER AREA · {{current_user.username}}</small><h1>Send videos.<br><span>Simply.</span></h1><p>Only invited members can use this sender.</p></section><form id="form" class="panel"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Recipient WhatsApp number</label><input name="whatsapp_number" placeholder="+2348012345678" required><p class="hint">International format. Only message people who expect your video.</p><label>Choose video (MP4 or 3GP, max 16 MB)</label><input name="video" type="file" accept=".mp4,.3gp,video/mp4,video/3gpp" required><button class="primary" id="send">Send via WhatsApp →</button><div id="notice" role="status"></div><div id="progress" hidden><progress id="bar" max="100" value="0"></progress><span id="pct">0%</span></div></form><script>
const form=document.getElementById('form'),send=document.getElementById('send'),notice=document.getElementById('notice');
function say(t,c){notice.textContent=t;notice.className=c||''}
form.addEventListener('submit',e=>{e.preventDefault();let f=form.elements.video.files[0];if(!f)return say('Choose a video.','bad');if(f.size>16*1048576)return say('Video is over 16 MB.','bad');send.disabled=true;progress.hidden=false;let x=new XMLHttpRequest();x.open('POST','/upload');x.upload.onprogress=e=>{if(e.lengthComputable){bar.value=Math.round(e.loaded/e.total*100);pct.textContent=bar.value+'%'}};x.onload=()=>{send.disabled=false;let d={};try{d=JSON.parse(x.responseText)}catch{}if(x.status<200||x.status>=300)return say(d.error||'Send failed.','bad');say('Submitted to Twilio. Checking delivery…','good');poll(d.job_id)};x.onerror=()=>{send.disabled=false;say('Network error.','bad')};x.send(new FormData(form))});
async function poll(id){for(let i=0;i<12;i++){try{let r=await fetch('/status/'+id),d=await r.json();if(['delivered','read'].includes(d.status))return say('Delivered. Video deletion is scheduled one hour after final status.','good');if(['failed','undelivered'].includes(d.status))return say('Delivery failed. Video deletion is scheduled one hour after final status.','bad')}catch{}await new Promise(r=>setTimeout(r,2500))}say('Twilio accepted the message. Final delivery status may take longer.','good')}
</script>{% endblock %}
