app = 'circle-video-website-qsz3ta'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'
  ENABLE_CLEANUP_THREAD = 'true'
  SESSION_COOKIE_SECURE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'circle_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
